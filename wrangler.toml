name = "riddle-web"
main = ".wrangler/index.js"
compatibility_date = "2025-01-01"

# Wrangler auto-compiles TypeScript via esbuild.
# Pre-built output in .wrangler/index.js (compiled from src/worker/index.ts)
[build]
command = "npm install && node build-worker.js"

# KV binding (diary memory storage)
[[kv_namespaces]]
binding = "RIDDLE_KV"
id = "bb4cf971fa0740c9a5056f3541820c21"

# Static assets (frontend pages served from same domain)
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# ═══════════════════════════════════════════════════════
# [vars] — These auto-appear in Cloudflare Dashboard
#           → Settings → Variables (Vars section)
# ═══════════════════════════════════════════════════════
# IMPORTANT: All var names are snake_case to match what the
# Dashboard displays. The code in config.ts reads BOTH
# snake_case and camelCase, so this works either way.
#
# These 8 vars are the most commonly tweaked.
# The other 20 params use hardcoded defaults in config.ts
# and are editable via /admin at runtime.
# ═══════════════════════════════════════════════════════

[vars]
# ─── Model names (change to swap models without code deploy) ───
agnes_model = "agnes-2.5-flash"
agnes_cn_model = "agnes-2.5-flash"
zhipu_model = "glm-4v-flash"

# ─── Base URLs ───
agnes_base_url = "https://apihub.agnes-ai.com/v1"
agnes_cn_base_url = "https://apihub.agnes-ai.cn/v1"
zhipu_base_url = "https://open.bigmodel.cn/api/paas/v4"

# ─── Admin auth (plaintext fallback if Secrets not set) ───
# IMPORTANT: Set admin_password + admin_token as Secrets in
# the dashboard for real security. These are plaintext fallbacks.
admin_password = ""
admin_token = "riddle-default-secret"

# ═══════════════════════════════════════════════════════
# REQUIRED SECRETS — Set in Dashboard → Settings → Variables → Add Secret
# ═══════════════════════════════════════════════════════
#   agnes_keys        → Agnes Intl API Key(s), comma-separated
#   agnes_cn_keys     → Agnes China API Key(s), comma-separated (optional)
#   zhipu_keys        → Zhipu AI API Key(s), comma-separated
#   admin_password    → Admin panel password (protects /admin)
#   admin_token       → Session signing secret (any random string)
#
# All other params (idle_timeout_ms, poll_interval_ms, etc.)
# have hardcoded defaults in src/worker/config.ts.
# They are visible & editable in the /admin panel at runtime.
# ═══════════════════════════════════════════════════════
